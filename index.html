<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trái Tim 3D</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020108;
    font-family:Arial, sans-serif;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#panel{
    position:fixed;
    left:20px;
    top:20px;
    width:280px;
    padding:20px;
    border-radius:20px;
    background:rgba(15,12,30,.88);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    color:white;
    z-index:10;
}

#panel h2{
    margin:0 0 18px;
    text-align:center;
    font-size:22px;
}

label{
    display:block;
    margin:12px 0 7px;
    font-size:14px;
    font-weight:bold;
}

input[type="text"],
select{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid #555;
    background:#211f2b;
    color:white;
    outline:none;
}

input[type="range"]{
    width:100%;
    accent-color:#ff238c;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

button{
    border:0;
    padding:11px 8px;
    border-radius:10px;
    background:linear-gradient(135deg,#ff1685,#9d19ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

#title{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:
        0 0 8px #ff1744,
        0 0 20px #ff1744,
        0 0 40px #ff1744;
    z-index:5;
    pointer-events:none;
    white-space:nowrap;
}

#hint{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.5);
    padding:10px 18px;
    border-radius:30px;
    z-index:5;
    pointer-events:none;
    font-size:14px;
}

@media(max-width:600px){
    #panel{
        width:220px;
        left:10px;
        top:10px;
        padding:14px;
    }

    #panel h2{
        font-size:18px;
    }

    #title{
        font-size:20px;
        top:10px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="title">❤️ I LOVE YOU ❤️</div>

<div id="panel">

<h2>❤️ Trái Tim 3D</h2>

<label>Nội dung chữ</label>
<input id="textInput" type="text" value="I LOVE YOU">

<label>Màu trái tim</label>
<select id="colorSelect">
    <option value="rainbow">🌈 Cầu vồng</option>
    <option value="red">❤️ Đỏ</option>
    <option value="pink">💗 Hồng</option>
    <option value="blue">💙 Xanh</option>
    <option value="purple">💜 Tím</option>
    <option value="gold">💛 Vàng</option>
</select>

<label>Tốc độ xoay</label>
<input id="speed" type="range" min="0" max="2" value="0.5" step="0.05">

<label>Kích thước chữ</label>
<input id="textSize" type="range" min="20" max="100" value="50">

<div class="buttons">
    <button id="pause">⏸ Dừng</button>
    <button id="beat">❤️ Đập tim</button>
    <button id="reset">🔄 Reset</button>
    <button id="fullscreen">⛶ Toàn màn hình</button>
</div>

</div>

<div id="hint">
🖱️ Kéo chuột để xoay • 🔍 Cuộn để zoom • 📱 Vuốt trên điện thoại
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

const canvas = document.getElementById("canvas");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020108);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

camera.position.set(0,0,65);

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true,
    alpha:false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

/* =========================
   ĐIỀU KHIỂN XOAY / ZOOM
========================= */

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.08;

controls.enableZoom = true;
controls.zoomSpeed = 1.2;

controls.enablePan = false;

controls.rotateSpeed = 0.7;

/* =========================
   ÁNH SÁNG
========================= */

const ambient = new THREE.AmbientLight(
    0xffffff,
    1.5
);

scene.add(ambient);

const light1 = new THREE.PointLight(
    0xff1744,
    5,
    150
);

light1.position.set(20,20,30);

scene.add(light1);

const light2 = new THREE.PointLight(
    0x7c4dff,
    4,
    150
);

light2.position.set(-30,-10,20);

scene.add(light2);

/* =========================
   NHÓM TRÁI TIM
========================= */

const heartGroup = new THREE.Group();

scene.add(heartGroup);

/* =========================
   TẠO HÌNH TRÁI TIM 3D
========================= */

const positions = [];
const colors = [];

const count = 6000;

for(let i=0;i<count;i++){

    const t = Math.random() * Math.PI * 2;

    const scale = Math.sqrt(Math.random());

    let x =
        16 * Math.pow(Math.sin(t),3);

    let y =
        13 * Math.cos(t)
        -5 * Math.cos(2*t)
        -2 * Math.cos(3*t)
        -Math.cos(4*t);

    x *= scale;
    y *= scale;

    /*
       tạo độ dày 3D
    */

    let z =
        (Math.random()-0.5)
        * 7
        * (1-scale*0.55);

    /*
       làm trái tim nhỏ vừa màn hình
    */

    x *= 1.15;
    y *= 1.15;

    positions.push(x,y,z);

    colors.push(
        1,
        0.05 + Math.random()*0.25,
        0.15 + Math.random()*0.5
    );
}

const heartGeometry =
    new THREE.BufferGeometry();

heartGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);

heartGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
        colors,
        3
    )
);

const heartMaterial =
    new THREE.PointsMaterial({

        size:0.20,

        vertexColors:true,

        transparent:true,

        opacity:0.95,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false
    });

const heart =
    new THREE.Points(
        heartGeometry,
        heartMaterial
    );

heartGroup.add(heart);

/* =========================
   TRÁI TIM VIỀN NGOÀI
========================= */

const outlinePoints = [];

for(let i=0;i<=400;i++){

    const t =
        (i/400)*Math.PI*2;

    const x =
        16*Math.pow(Math.sin(t),3);

    const y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    outlinePoints.push(
        new THREE.Vector3(
            x*1.17,
            y*1.17,
            0
        )
    );
}

const outlineGeometry =
    new THREE.BufferGeometry()
    .setFromPoints(outlinePoints);

const outlineMaterial =
    new THREE.LineBasicMaterial({
        color:0xff1744,
        transparent:true,
        opacity:0.8
    });

const outline =
    new THREE.LineLoop(
        outlineGeometry,
        outlineMaterial
    );

heartGroup.add(outline);

/* =========================
   TẠO CHỮ 3D CHẠY XUNG QUANH
========================= */

let textSprites = [];

let currentText = "I LOVE YOU";

function createTextSprite(text){

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 128;

    const ctx =
        c.getContext("2d");

    ctx.clearRect(
        0,0,
        c.width,
        c.height
    );

    ctx.font =
        "bold 55px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.shadowColor =
        "#ff1744";

    ctx.shadowBlur =
        25;

    ctx.fillStyle =
        "#ffffff";

    ctx.fillText(
        text,
        c.width/2,
        c.height/2
    );

    const texture =
        new THREE.CanvasTexture(c);

    texture.needsUpdate = true;

    const material =
        new THREE.SpriteMaterial({

            map:texture,

            transparent:true,

            depthWrite:false
        });

    const sprite =
        new THREE.Sprite(material);

    sprite.scale.set(
        13,
        3.3,
        1
    );

    return sprite;
}

/* =========================
   TẠO NHIỀU CHỮ
========================= */

function buildTexts(){

    textSprites.forEach(s=>{
        heartGroup.remove(s);

        if(s.material.map){
            s.material.map.dispose();
        }

        s.material.dispose();
    });

    textSprites=[];

    for(let i=0;i<12;i++){

        const sprite =
            createTextSprite(
                currentText
            );

        sprite.userData.angle =
            (i/12)*Math.PI*2;

        textSprites.push(sprite);

        heartGroup.add(sprite);
    }
}

buildTexts();

/* =========================
   SAO NỀN
========================= */

const starPositions = [];

for(let i=0;i<1800;i++){

    starPositions.push(
        (Math.random()-0.5)*300,
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*150
    );
}

const starGeometry =
    new THREE.BufferGeometry();

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({

        color:0xffffff,

        size:0.12,

        transparent:true,

        opacity:0.7
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);

/* =========================
   THIẾT LẬP
========================= */

let speed = 0.5;

let paused = false;

let beat = false;

let beatTime = 0;

let textSize = 50;

/* =========================
   INPUT CHỮ
========================= */

document
.getElementById("textInput")
.addEventListener(
    "input",
    function(){

        currentText =
            this.value ||
            "I LOVE YOU";

        document
        .getElementById("title")
        .textContent =
            "❤️ " +
            currentText +
            " ❤️";

        buildTexts();
    }
);

/* =========================
   TỐC ĐỘ
========================= */

document
.getElementById("speed")
.addEventListener(
    "input",
    function(){

        speed =
            Number(this.value);
    }
);

/* =========================
   KÍCH THƯỚC CHỮ
========================= */

document
.getElementById("textSize")
.addEventListener(
    "input",
    function(){

        textSize =
            Number(this.value);

        textSprites.forEach(
            sprite=>{

                const scale =
                    textSize/50;

                sprite.scale.set(
                    13*scale,
                    3.3*scale,
                    1
                );
            }
        );
    }
);

/* =========================
   ĐỔI MÀU
========================= */

document
.getElementById("colorSelect")
.addEventListener(
    "change",
    function(){

        const value =
            this.value;

        if(value==="red"){
            heartMaterial.color
                .set(0xff1744);
        }

        if(value==="pink"){
            heartMaterial.color
                .set(0xff1493);
        }

        if(value==="blue"){
            heartMaterial.color
                .set(0x2196ff);
        }

        if(value==="purple"){
            heartMaterial.color
                .set(0xb000ff);
        }

        if(value==="gold"){
            heartMaterial.color
                .set(0xffd600);
        }

        if(value==="rainbow"){
            heartMaterial
                .vertexColors = true;

            heartMaterial
                .needsUpdate = true;
        }
    }
);

/* =========================
   NÚT DỪNG
========================= */

document
.getElementById("pause")
.addEventListener(
    "click",
    function(){

        paused = !paused;

        this.textContent =
            paused
            ? "▶ Chạy"
            : "⏸ Dừng";
    }
);

/* =========================
   NÚT ĐẬP TIM
========================= */

document
.getElementById("beat")
.addEventListener(
    "click",
    function(){

        beat = true;

        beatTime = 0;
    }
);

/* =========================
   RESET
========================= */

document
.getElementById("reset")
.addEventListener(
    "click",
    function(){

        camera.position.set(
            0,
            0,
            65
        );

        controls.target.set(
            0,
            0,
            0
        );

        heartGroup.rotation.set(
            0,
            0,
            0
        );

        speed=0.5;

        document
        .getElementById("speed")
        .value=0.5;
    }
);

/* =========================
   TOÀN MÀN HÌNH
========================= */

document
.getElementById("fullscreen")
.addEventListener(
    "click",
    function(){

        if(!document.fullscreenElement){

            document
            .documentElement
            .requestFullscreen();

        }else{

            document.exitFullscreen();
        }
    }
);

/* =========================
   ANIMATION
========================= */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta =
        clock.getDelta();

    if(!paused){

        /*
           tự xoay trái tim
        */

        heartGroup.rotation.y
            += speed*delta;

        heartGroup.rotation.z
            += speed*0.08*delta;

        /*
           chữ chạy quanh trái tim
        */

        textSprites.forEach(
            (sprite,index)=>{

                const angle =
                    sprite.userData.angle
                    + performance.now()*0.0005;

                const radius = 29;

                sprite.position.x =
                    Math.cos(angle)*radius;

                sprite.position.y =
                    Math.sin(angle)*radius*0.55;

                sprite.position.z =
                    Math.sin(angle)*10;

                /*
                   chữ luôn hướng về camera
                */

                sprite.lookAt(
                    camera.position
                );
            }
        );

        /*
           hiệu ứng cầu vồng
        */

        if(
            document
            .getElementById("colorSelect")
            .value === "rainbow"
        ){

            const time =
                performance.now()*0.001;

            const arr =
                heartGeometry
                .attributes
                .color
                .array;

            for(
                let i=0;
                i<arr.length;
                i+=3
            ){

                const hue =
                    (time+i*0.00005)%1;

                const color =
                    new THREE.Color();

                color.setHSL(
                    hue,
                    1,
                    0.55
                );

                arr[i]=color.r;
                arr[i+1]=color.g;
                arr[i+2]=color.b;
            }

            heartGeometry
            .attributes
            .color
            .needsUpdate=true;
        }
    }

    /*
       hiệu ứng đập tim
    */

    if(beat){

        beatTime += delta;

        const pulse =
            1 +
            Math.sin(
                beatTime*18
            )*0.10*
            Math.max(
                0,
                1-beatTime
            );

        heartGroup.scale.set(
            pulse,
            pulse,
            pulse
        );

        if(beatTime>1){
            beat=false;

            heartGroup.scale.set(
                1,1,1
            );
        }
    }

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
