<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>❤️ 3D Love Heart</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  font-family:Arial,sans-serif;
}

#scene{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* BẢNG ĐIỀU KHIỂN */
#panel{
  position:fixed;
  z-index:20;
  left:18px;
  top:18px;
  width:310px;
  padding:16px;
  border-radius:18px;
  color:#fff;
  background:rgba(8,8,18,.72);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

#panel h2{
  margin:0 0 12px;
  font-size:19px;
}

label{
  display:block;
  font-size:12px;
  opacity:.8;
  margin:10px 0 5px;
}

input[type=text]{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ffffff25;
  outline:0;
  background:#ffffff12;
  color:white;
}

input[type=range]{
  width:100%;
  accent-color:#ff2775;
}

.row{
  display:flex;
  gap:8px;
}

button{
  flex:1;
  padding:10px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:#ffffff18;
  cursor:pointer;
}

button:hover{
  background:#ffffff30;
}

input[type=color]{
  width:50px;
  height:34px;
  border:0;
  background:none;
}

.small{
  font-size:11px;
  opacity:.55;
  line-height:1.4;
  margin-top:11px;
}

#loading{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  background:#000;
  color:#fff;
  font-size:16px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  #panel{
    left:10px;
    top:10px;
    width:285px;
    padding:12px;
  }

  .small{
    display:none;
  }
}
</style>
</head>

<body>

<div id="loading">
  Đang tạo trái tim 3D... ❤️
</div>

<div id="scene"></div>

<!-- BẢNG ĐIỀU KHIỂN -->
<div id="panel">

  <h2>❤️ 3D LOVE</h2>

  <label>Nội dung chữ</label>

  <input
    id="text"
    type="text"
    value="I LOVE YOU"
    maxlength="30"
  >

  <label>Tốc độ</label>

  <input
    id="speed"
    type="range"
    min="0"
    max="2"
    step=".01"
    value=".65"
  >

  <label>Kích thước chữ</label>

  <input
    id="textSize"
    type="range"
    min=".55"
    max="1.7"
    step=".01"
    value="1"
  >

  <label>Màu trái tim</label>

  <div class="row">

    <input
      id="color"
      type="color"
      value="#ff176f"
    >

    <button id="rainbow">
      🌈 Cầu vồng
    </button>

  </div>

  <div
    class="row"
    style="margin-top:10px"
  >

    <button id="pause">
      ⏸ Tạm dừng
    </button>

    <button id="reset">
      ↻ Reset
    </button>

  </div>

  <div class="small">
    Kéo chuột hoặc vuốt màn hình để xoay.
    Cuộn chuột / pinch để zoom.
    Chữ 3D bay quanh trái tim và tự đổi màu.
  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";


const $ = id => document.getElementById(id);

let paused = false;
let rainbow = true;
let hue = 0;
let textObjects = [];


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x000005);

scene.fog =
  new THREE.FogExp2(
    0x000005,
    .018
  );


/* =========================
   CAMERA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    45,
    innerWidth / innerHeight,
    .1,
    200
  );

camera.position.set(
  0,
  0,
  25
);


/* =========================
   RENDERER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.25;

$("scene").appendChild(
  renderer.domElement
);


/* =========================
   CAMERA CONTROL
========================= */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.dampingFactor = .06;

controls.enablePan = false;

controls.minDistance = 11;

controls.maxDistance = 45;


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.8
  )
);


const lightA =
  new THREE.PointLight(
    0xff2277,
    45,
    35
  );

lightA.position.set(
  8,
  5,
  10
);

scene.add(lightA);


const lightB =
  new THREE.PointLight(
    0x5555ff,
    35,
    35
  );

lightB.position.set(
  -8,
  -5,
  8
);

scene.add(lightB);


/* =========================
   STARS
========================= */

const starCount = 1800;

const starPos =
  new Float32Array(
    starCount * 3
  );

for(
  let i=0;
  i<starCount;
  i++
){

  const r =
    THREE.MathUtils.randFloat(
      28,
      75
    );

  const a =
    Math.random() *
    Math.PI * 2;

  const z =
    THREE.MathUtils.randFloatSpread(2);

  const s =
    Math.sqrt(
      1-z*z
    );

  starPos[i*3] =
    r*s*Math.cos(a);

  starPos[i*3+1] =
    r*z;

  starPos[i*3+2] =
    r*s*Math.sin(a);
}


const starGeo =
  new THREE.BufferGeometry();

starGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(
    starPos,
    3
  )
);


const stars =
  new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({
      color:0xffffff,
      size:.045,
      transparent:true,
      opacity:.8
    })
  );

scene.add(stars);


/* =========================
   HEART FORMULA
========================= */

function heart(
  t,
  scale=1
){

  const x =
    16 *
    Math.sin(t) ** 3;

  const y =
    13*Math.cos(t)
    -5*Math.cos(2*t)
    -2*Math.cos(3*t)
    -Math.cos(4*t);

  return {
    x:x*.27*scale,
    y:y*.27*scale
  };
}


/* =========================
   CREATE HEART
========================= */

const heartShape =
  new THREE.Shape();

const N = 240;

for(
  let i=0;
  i<=N;
  i++
){

  const p =
    heart(
      i/N *
      Math.PI * 2
    );

  if(i===0){

    heartShape.moveTo(
      p.x,
      p.y
    );

  }else{

    heartShape.lineTo(
      p.x,
      p.y
    );
  }
}


const heartGeo =
  new THREE.ExtrudeGeometry(
    heartShape,
    {
      depth:1.65,
      bevelEnabled:true,
      bevelSegments:5,
      steps:3,
      bevelSize:.14,
      bevelThickness:.14
    }
  );

heartGeo.center();


/* =========================
   HEART MATERIAL
========================= */

const heartMat =
  new THREE.MeshPhysicalMaterial({

    color:0xff176f,

    emissive:0xff064c,

    emissiveIntensity:1.8,

    roughness:.2,

    metalness:.12,

    clearcoat:1,

    clearcoatRoughness:.1

  });


const heartMesh =
  new THREE.Mesh(
    heartGeo,
    heartMat
  );

scene.add(heartMesh);


/* =========================
   HEART GLOW
========================= */

const glow =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      4.8,
      40,
      40
    ),

    new THREE.MeshBasicMaterial({

      color:0xff176f,

      transparent:true,

      opacity:.065,

      blending:
        THREE.AdditiveBlending,

      depthWrite:false

    })

  );


glow.scale.set(
  1.2,
  .95,
  .55
);

scene.add(glow);


/* =========================
   HEART PARTICLES
========================= */

const particleCount = 1400;

const pp =
  new Float32Array(
    particleCount * 3
  );


for(
  let i=0;
  i<particleCount;
  i++
){

  const t =
    Math.random() *
    Math.PI * 2;

  const p =
    heart(t,1);

  const jitter =
    THREE.MathUtils.randFloatSpread(.13);

  pp[i*3] =
    p.x + jitter;

  pp[i*3+1] =
    p.y + jitter;

  pp[i*3+2] =
    THREE.MathUtils.randFloatSpread(1.8);
}


const pg =
  new THREE.BufferGeometry();

pg.setAttribute(
  "position",
  new THREE.BufferAttribute(
    pp,
    3
  )
);


const particles =
  new THREE.Points(

    pg,

    new THREE.PointsMaterial({

      color:0xff9fca,

      size:.055,

      transparent:true,

      opacity:.9,

      blending:
        THREE.AdditiveBlending

    })

  );

scene.add(particles);


/* =========================
   ORBIT RINGS
========================= */

const orbitGroup =
  new THREE.Group();

scene.add(
  orbitGroup
);


for(
  let i=0;
  i<3;
  i++
){

  const torus =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        6.7+i*.55,
        .025,
        8,
        180
      ),

      new THREE.MeshBasicMaterial({

        color:
          i===1
          ? 0x6c63ff
          : 0xff3b87,

        transparent:true,

        opacity:.22,

        blending:
          THREE.AdditiveBlending

      })

    );

  torus.rotation.x =
    Math.PI/2 + i*.3;

  torus.rotation.z =
    i*.7;

  orbitGroup.add(torus);
}


/* =========================
   TEXTURE FOR 3D TEXT
========================= */

function makeTexture(
  text,
  color,
  size
){

  const c =
    document.createElement(
      "canvas"
    );

  c.width = 1024;

  c.height = 180;

  const ctx =
    c.getContext("2d");

  ctx.clearRect(
    0,
    0,
    c.width,
    c.height
  );

  const fs =
    74 * size;

  ctx.font =
    `900 ${fs}px Arial`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.shadowColor =
    color;

  ctx.shadowBlur =
    25;

  ctx.fillStyle =
    color;

  ctx.fillText(
    text,
    512,
    90
  );

  ctx.shadowBlur = 0;

  ctx.lineWidth = 3;

  ctx.strokeStyle =
    "rgba(255,255,255,.35)";

  ctx.strokeText(
    text,
    512,
    90
  );

  const tex =
    new THREE.CanvasTexture(c);

  tex.colorSpace =
    THREE.SRGBColorSpace;

  return tex;
}


/* =========================
   CREATE TEXT
========================= */

function rebuildText(){

  textObjects.forEach(o=>{

    if(o.material.map)
      o.material.map.dispose();

    o.material.dispose();

    scene.remove(o);

  });

  textObjects = [];


  const value =
    $("text").value.trim()
    || "I LOVE YOU";

  const size =
    Number(
      $("textSize").value
    );

  const count = 20;


  for(
    let i=0;
    i<count;
    i++
  ){

    const a =
      i/count *
      Math.PI * 2;


    const color =
      new THREE.Color();

    color.setHSL(
      (i/count+hue)%1,
      .95,
      .65
    );


    const tex =
      makeTexture(
        value,
        "#" +
        color.getHexString(),
        size
      );


    const mat =
      new THREE.SpriteMaterial({

        map:tex,

        transparent:true,

        depthWrite:false,

        blending:
          THREE.AdditiveBlending

      });


    const s =
      new THREE.Sprite(mat);


    const rx = 7.4;

    const ry = 4.8;

    const rz = 3.1;


    s.position.set(

      Math.cos(a)*rx,

      Math.sin(a)*ry,

      Math.sin(a*2)*rz

    );


    s.scale.set(

      4.0*size,

      .72*size,

      1

    );


    s.userData = {

      a:a,

      i:i

    };


    scene.add(s);

    textObjects.push(s);

  }

}


/* Tạo chữ lần đầu */
rebuildText();


/* =========================
   COLOR CONTROL
========================= */

$("text")
.addEventListener(
  "input",
  rebuildText
);


$("textSize")
.addEventListener(
  "input",
  rebuildText
);


$("color")
.addEventListener(
  "input",
  ()=>{

    rainbow = false;

    $("rainbow").textContent =
      "🌈 Cầu vồng";

    heartMat.color.set(
      $("color").value
    );

    heartMat.emissive.set(
      $("color").value
    );

    glow.material.color.set(
      $("color").value
    );

    particles.material.color.set(
      $("color").value
    );

  }
);


/* =========================
   RAINBOW
========================= */

$("rainbow")
.addEventListener(
  "click",
  ()=>{

    rainbow = !rainbow;

    $("rainbow").textContent =
      rainbow
      ? "🌈 Cầu vồng: ON"
      : "🌈 Cầu vồng: OFF";

  }
);


/* =========================
   PAUSE
========================= */

$("pause")
.addEventListener(
  "click",
  ()=>{

    paused = !paused;

    $("pause").textContent =
      paused
      ? "▶ Tiếp tục"
      : "⏸ Tạm dừng";

  }
);


/* =========================
   RESET
========================= */

$("reset")
.addEventListener(
  "click",
  ()=>{

    camera.position.set(
      0,
      0,
      25
    );

    controls.target.set(
      0,
      0,
      0
    );

    controls.update();


    $("text").value =
      "I LOVE YOU";

    $("speed").value =
      ".65";

    $("textSize").value =
      "1";

    $("color").value =
      "#ff176f";


    rainbow = true;

    heartMat.color.set(
      "#ff176f"
    );

    heartMat.emissive.set(
      "#ff064c"
    );

    glow.material.color.set(
      "#ff176f"
    );

    particles.material.color.set(
      "#ff9fca"
    );


    $("rainbow").textContent =
      "🌈 Cầu vồng: ON";


    rebuildText();

  }
);


/* =========================
   ANIMATION
========================= */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const t =
    clock.getElapsedTime();


  const speed =
    Number(
      $("speed").value
    );


  if(!paused){

    /* Trái tim xoay */

    heartMesh.rotation.y +=
      .0045 * speed;

    heartMesh.rotation.x =
      Math.sin(t*.7)*.07;


    /* Vòng tròn */

    orbitGroup.rotation.y -=
      .0025 * speed;

    orbitGroup.rotation.x +=
      .001 * speed;


    /* Hạt */

    particles.rotation.y +=
      .002 * speed;

    stars.rotation.y +=
      .00015;


    /* Chữ chạy */

    textObjects.forEach(
      (s,i)=>{

        s.userData.a +=
          .0025 * speed;

        const a =
          s.userData.a;


        s.position.x =
          Math.cos(a)*7.4;

        s.position.y =
          Math.sin(a)*4.8
          +
          Math.sin(
            t*1.5+i
          )*.08;

        s.position.z =
          Math.sin(a*2)*3.1;


        s.material.opacity =
          .7 +
          .3 *
          Math.sin(
            t*2+i
          );

      }
    );


    /* Nhịp đập */

    const pulse =
      1 +
      Math.sin(t*2.6)*.035;

    heartMesh.scale.setScalar(
      pulse
    );


    glow.scale.x =
      1.2 +
      Math.sin(t*2)*.04;

    glow.scale.y =
      .95 +
      Math.sin(t*2)*.04;


    /* Ánh sáng di chuyển */

    lightA.position.x =
      Math.sin(t*.7)*9;

    lightA.position.z =
      Math.cos(t*.7)*9;


    lightB.position.x =
      Math.cos(t*.5)*9;

    lightB.position.z =
      Math.sin(t*.5)*8;


    /* Cầu vồng */

    if(rainbow){

      hue =
        (hue+.0012)%1;


      const c =
        new THREE.Color();

      c.setHSL(
        hue,
        .95,
        .6
      );


      heartMat.color.copy(c);

      heartMat.emissive
        .copy(c)
        .multiplyScalar(.55);


      glow.material.color
        .copy(c);

      particles.material.color
        .copy(c);


      lightA.color.setHSL(
        hue,
        .9,
        .6
      );


      lightB.color.setHSL(
        (hue+.5)%1,
        .9,
        .6
      );

    }

  }


  controls.update();

  renderer.render(
    scene,
    camera
  );

}


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        2
      )
    );

  }
);


/* CHẠY */

animate();


setTimeout(
  ()=>
    $("loading")
      .classList
      .add("hidden"),
  700
);

</script>

</body>
</html>
